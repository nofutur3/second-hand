name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Lint
        run: make lint

      - name: Test
        run: make test

  build:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: registry.nofutur3.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api/Dockerfile
          push: true
          tags: |
            registry.nofutur3.com/secondhand-api:latest
            registry.nofutur3.com/secondhand-api:sha-${{ github.sha }}
          cache-from: type=registry,ref=registry.nofutur3.com/secondhand-api:buildcache
          cache-to: type=registry,ref=registry.nofutur3.com/secondhand-api:buildcache,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: true
          tags: |
            registry.nofutur3.com/secondhand-frontend:latest
            registry.nofutur3.com/secondhand-frontend:sha-${{ github.sha }}
          cache-from: type=registry,ref=registry.nofutur3.com/secondhand-frontend:buildcache
          cache-to: type=registry,ref=registry.nofutur3.com/secondhand-frontend:buildcache,mode=max

      - name: Build and push cron image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/cron/Dockerfile
          push: true
          tags: |
            registry.nofutur3.com/secondhand-cron:latest
            registry.nofutur3.com/secondhand-cron:sha-${{ github.sha }}
          cache-from: type=registry,ref=registry.nofutur3.com/secondhand-cron:buildcache
          cache-to: type=registry,ref=registry.nofutur3.com/secondhand-cron:buildcache,mode=max

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      # osiris runs Flux (GitOps) watching this repo's k8s/ directory directly
      # (see apps/second-hand/source.yaml in nofutur3/osiris-cluster) - no cluster
      # credentials here. Bumping the image tag in-repo and landing it on main is
      # the deploy; Flux reconciles it onto the cluster within ~1 minute on its own.
      - name: Pin manifests to this build's image
        run: |
          SHA=${{ github.sha }}
          sed -i "s#registry.nofutur3.com/secondhand-api:.*#registry.nofutur3.com/secondhand-api:sha-$SHA#" k8s/api-deployment.yaml
          sed -i "s#registry.nofutur3.com/secondhand-frontend:.*#registry.nofutur3.com/secondhand-frontend:sha-$SHA#" k8s/frontend-deployment.yaml
          sed -i "s#registry.nofutur3.com/secondhand-cron:.*#registry.nofutur3.com/secondhand-cron:sha-$SHA#" k8s/ebay-cronjob.yaml

      # main is protected and requires the "CI" status check to pass before any
      # ref update - including a direct bot push - so the bot's GITHUB_TOKEN can
      # never push straight to main (the check can't exist on a commit before
      # that commit exists). Going through a PR + auto-merge instead: the PR's
      # own "CI" run satisfies the required check, then GitHub merges it for us.
      - name: Open deploy PR and enable auto-merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/api-deployment.yaml k8s/frontend-deployment.yaml k8s/ebay-cronjob.yaml
          if git diff --cached --quiet; then
            echo "No image change, nothing to deploy."
            exit 0
          fi
          BRANCH="deploy/sha-${{ github.sha }}"
          git checkout -b "$BRANCH"
          git commit -m "deploy: sha-${{ github.sha }}"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "deploy: sha-${{ github.sha }}" \
            --body "Automated image-tag bump for build ${{ github.sha }}."
          gh pr merge "$BRANCH" --auto --squash --delete-branch
